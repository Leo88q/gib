  R.render(S,C);
}
function spotMatrix(idx,intensity,coneMesh,coneOpacity){spots[idx].intensity=intensity;coneMesh.material.opacity=coneOpacity;}
function spher2(p,t){var d=p.clone().sub(t),r=d.length();return{r:r,th:Math.atan2(d.x,d.z),ph:Math.acos(Math.max(-1,Math.min(1,d.y/r)))};}
requestAnimationFrame(loop);
})();
