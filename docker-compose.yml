services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gib}
    volumes:
      - gib_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gib} -d ${POSTGRES_DB:-gib}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      GIB_STORE: postgres
      GIB_RATE_LIMIT_STORE: postgres
      GIB_POSTGRES_URL: postgresql://${POSTGRES_USER:-gib}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gib}
    ports:
      - "${APP_PORT:-3000}:3000"

  notifications-cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    command: >
      sh -c 'while true; do
        sleep 3600;
        if [ -n "$$CRON_SECRET" ]; then
          curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/notifications || true;
        fi;
      done'

volumes:
  gib_pgdata:
